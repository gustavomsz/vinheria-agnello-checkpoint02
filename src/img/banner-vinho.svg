<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Vinho tinto sendo servido em uma taça, com cortina de veludo bordô ao fundo">
  <defs>
    <radialGradient id="fundo" cx="70%" cy="55%" r="80%">
      <stop offset="0" stop-color="#2a070f"/>
      <stop offset=".55" stop-color="#12030a"/>
      <stop offset="1" stop-color="#060103"/>
    </radialGradient>
    <radialGradient id="brilho" cx="1180" cy="470" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3182f" stop-opacity=".38"/>
      <stop offset="1" stop-color="#a3182f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veludo1" x1="0" x2="1">
      <stop offset="0" stop-color="#1c0308"/>
      <stop offset=".35" stop-color="#6e1225"/>
      <stop offset=".55" stop-color="#8f1d33"/>
      <stop offset=".8" stop-color="#3d0712"/>
      <stop offset="1" stop-color="#14020a"/>
    </linearGradient>
    <linearGradient id="veludo2" x1="0" x2="1">
      <stop offset="0" stop-color="#2a050d"/>
      <stop offset=".5" stop-color="#7d1730"/>
      <stop offset="1" stop-color="#22040b"/>
    </linearGradient>
    <linearGradient id="veludo3" x1="0" x2="1">
      <stop offset="0" stop-color="#160206"/>
      <stop offset=".6" stop-color="#55101f"/>
      <stop offset="1" stop-color="#1a0308"/>
    </linearGradient>
    <linearGradient id="vinho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e0a1b"/>
      <stop offset="1" stop-color="#22020a"/>
    </linearGradient>
    <linearGradient id="filete" x1="0" x2="1">
      <stop offset="0" stop-color="#7a0d1f"/>
      <stop offset=".5" stop-color="#d0263d"/>
      <stop offset="1" stop-color="#7a0d1f"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="garrafa" x1="0" x2="1">
      <stop offset="0" stop-color="#050102"/>
      <stop offset=".3" stop-color="#2b0a12"/>
      <stop offset=".45" stop-color="#4a1520"/>
      <stop offset=".6" stop-color="#140306"/>
      <stop offset="1" stop-color="#050102"/>
    </linearGradient>
    <clipPath id="taca">
      <path d="M1060 330 C1055 470 1110 562 1180 565 C1250 562 1305 470 1300 330 Z"/>
    </clipPath>
    <filter id="desfoque"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="desfoque-leve"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- fundo e luz atrás da taça -->
  <rect width="1600" height="800" fill="url(#fundo)"/>
  <rect width="1600" height="800" fill="url(#brilho)"/>

  <!-- cortina de veludo (lado esquerdo) -->
  <path d="M0 0 H470 C400 180 540 420 400 800 H0 Z" fill="url(#veludo3)"/>
  <path d="M0 0 H360 C290 220 430 450 300 800 H0 Z" fill="url(#veludo1)"/>
  <path d="M0 0 H170 C110 250 250 500 150 800 H0 Z" fill="url(#veludo2)"/>
  <path d="M215 0 C165 240 315 470 215 800 H245 C335 470 195 240 255 0 Z" fill="#b12a43" opacity=".35" filter="url(#desfoque)"/>
  <path d="M70 0 C30 260 150 520 70 800 H90 C170 520 50 260 95 0 Z" fill="#a8263e" opacity=".3" filter="url(#desfoque)"/>
  <!-- tecido caindo no canto de baixo à direita -->
  <path d="M1600 800 V600 C1430 640 1290 760 1120 800 Z" fill="url(#veludo3)"/>
  <path d="M1600 800 V680 C1480 700 1390 770 1300 800 Z" fill="#5c1222" opacity=".8"/>

  <!-- garrafa inclinada servindo -->
  <g transform="translate(1203 170) rotate(62)">
    <path d="M-13 0 H13 V-130 C13 -170 50 -190 50 -245 V-760 H-50 V-245 C-50 -190 -13 -170 -13 -130 Z" fill="url(#garrafa)"/>
    <rect x="-16" y="-10" width="32" height="14" rx="3" fill="#1a0509"/>
    <rect x="-36" y="-560" width="7" height="300" rx="3.5" fill="#fff" opacity=".1"/>
  </g>

  <!-- filete de vinho -->
  <path d="M1198 176 C1197 260 1194 350 1192 442 H1186 C1188 350 1190 260 1191 176 Z" fill="url(#filete)"/>

  <!-- taça -->
  <g clip-path="url(#taca)">
    <rect x="1040" y="440" width="280" height="140" fill="url(#vinho)"/>
    <ellipse cx="1180" cy="441" rx="118" ry="11" fill="#8c1226"/>
    <ellipse cx="1189" cy="441" rx="22" ry="4" fill="#d63a50" opacity=".6"/>
  </g>
  <path d="M1060 330 C1055 470 1110 562 1180 565 C1250 562 1305 470 1300 330 Z" fill="url(#vidro)" stroke="#fff" stroke-opacity=".38" stroke-width="2"/>
  <ellipse cx="1180" cy="330" rx="120" ry="16" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
  <path d="M1080 360 C1078 440 1100 505 1135 535" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" filter="url(#desfoque-leve)"/>
  <rect x="1175" y="563" width="10" height="172" fill="url(#vidro)" stroke="#fff" stroke-opacity=".3"/>
  <ellipse cx="1180" cy="740" rx="96" ry="14" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".38" stroke-width="2"/>
  <ellipse cx="1180" cy="752" rx="140" ry="10" fill="#000" opacity=".5" filter="url(#desfoque)"/>

  <!-- luzes desfocadas ao fundo -->
  <g fill="#e0a24a" filter="url(#desfoque)">
    <circle cx="880" cy="140" r="9" opacity=".25"/>
    <circle cx="1450" cy="260" r="12" opacity=".18"/>
    <circle cx="960" cy="610" r="7" opacity=".2"/>
    <circle cx="1520" cy="120" r="8" opacity=".22"/>
  </g>
</svg>
